<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - Windows 8 Style</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1><i class="fas fa-gamepad"></i> Game Hub</h1>
            <div class="header-actions">
                <button id="addGameBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Adicionar Jogo
                </button>
                <button id="addProgramBtn" class="btn btn-secondary">
                    <i class="fas fa-plus"></i> Adicionar Programa
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content - Horizontal Scroll -->
    <main class="main-container">
        <!-- Section: Jogos -->
        <section class="hub-section">
            <h2 class="section-title">Jogos</h2>
            <div class="tile-container" id="gamesContainer">
                <!-- Games tiles will be inserted here -->
            </div>
        </section>

        <!-- Section: Programas -->
        <section class="hub-section">
            <h2 class="section-title">Programas</h2>
            <div class="tile-container" id="programsContainer">
                <!-- Program tiles will be inserted here -->
            </div>
        </section>

        <!-- Section: Notícias -->
        <section class="hub-section">
            <h2 class="section-title">Notícias Gamer</h2>
            <div class="tile-container news-container" id="newsContainer">
                <!-- News tiles will be inserted here -->
            </div>
        </section>

        <!-- Section: Dicas do Dia -->
        <section class="hub-section">
            <h2 class="section-title">O Que Jogar Hoje</h2>
            <div class="tile-container tips-container" id="tipsContainer">
                <!-- Tips tiles will be inserted here -->
            </div>
        </section>

        <!-- Section: Curiosidades -->
        <section class="hub-section">
            <h2 class="section-title">Curiosidades</h2>
            <div class="tile-container curiosities-container" id="curiositiesContainer">
                <!-- Curiosities tiles will be inserted here -->
            </div>
        </section>
    </main>

    <!-- Modal para Adicionar Jogo -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Adicionar Novo Jogo</h2>
            <form id="gameForm">
                <div class="form-group">
                    <label for="gameName">Nome do Jogo:</label>
                    <input type="text" id="gameName" required placeholder="Ex: Cyberpunk 2077">
                </div>
                <div class="form-group">
                    <label for="gamePath">Caminho do Executável:</label>
                    <input type="text" id="gamePath" required placeholder="Ex: C:\Games\Cyberpunk\cyberpunk2077.exe">
                </div>
                <div class="form-group">
                    <label for="gameGenre">Gênero:</label>
                    <select id="gameGenre">
                        <option value="Ação">Ação</option>
                        <option value="RPG">RPG</option>
                        <option value="Aventura">Aventura</option>
                        <option value="Estratégia">Estratégia</option>
                        <option value="Esporte">Esporte</option>
                        <option value="Corrida">Corrida</option>
                        <option value="Terror">Terror</option>
                        <option value="Indie">Indie</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tamanho do Tile:</label>
                    <div class="tile-size-selector">
                        <button type="button" class="tile-size-btn active" data-size="medium">Médio</button>
                        <button type="button" class="tile-size-btn" data-size="wide">Largo</button>
                        <button type="button" class="tile-size-btn" data-size="large">Grande</button>
                    </div>
                    <input type="hidden" id="tileSize" value="medium">
                </div>
                <div class="search-status" id="searchStatus"></div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-save"></i> Salvar Jogo
                </button>
            </form>
        </div>
    </div>

    <!-- Modal para Adicionar Programa -->
    <div id="programModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Adicionar Novo Programa</h2>
            <form id="programForm">
                <div class="form-group">
                    <label for="programName">Nome do Programa:</label>
                    <input type="text" id="programName" required placeholder="Ex: Discord">
                </div>
                <div class="form-group">
                    <label for="programPath">Caminho do Executável:</label>
                    <input type="text" id="programPath" required placeholder="Ex: C:\Program Files\Discord\Discord.exe">
                </div>
                <div class="form-group">
                    <label for="programIcon">Ícone (classe Font Awesome):</label>
                    <input type="text" id="programIcon" placeholder="Ex: fa-discord" value="fa-desktop">
                    <small>Deixe em branco para usar ícone padrão</small>
                </div>
                <div class="form-group">
                    <label>Tamanho do Tile:</label>
                    <div class="tile-size-selector">
                        <button type="button" class="tile-size-btn active" data-size="medium">Médio</button>
                        <button type="button" class="tile-size-btn" data-size="wide">Largo</button>
                    </div>
                    <input type="hidden" id="programTileSize" value="medium">
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-save"></i> Salvar Programa
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
